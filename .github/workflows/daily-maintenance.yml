# Calls the daily_maintenance() database function once a day.
# Keeps a Supabase Free project from pausing after 7 days without activity,
# and deletes orders older than 12 months (see the privacy notice).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (the public anon/publishable key).
# If the call fails, GitHub emails the repository owner, so this also works as a basic uptime alert.
name: Daily maintenance

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch: # "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call daily_maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/daily_maintenance" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
